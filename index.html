
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b18">
  <title>Luna — Voice Assistant</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <div class="logo">☾ LUNA</div>
      <div id="status">Ready when you are</div>
    </header>

    <section class="main">
      <p class="eyebrow">YOUR PERSONAL AI</p>
      <h1>Hello, Remo<span>.</span></h1>
      <p class="subtitle">Your Luna, one voice away.</p>

      <div class="orb" id="orb">☾</div>

      <p id="voiceStatus">Luna is waiting</p>

      <button id="talkBtn">🎙 Tap to speak</button>
      <button id="stopBtn" class="stop">Stop voice</button>

      <p id="heard">Your spoken words will appear here.</p>
      <p id="reply">Hi Remo! I'm ready when you are.</p>

      <p class="note">
        Demo version: online AI and always-on wake word
        are not connected yet.
      </p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
